name: Test - Not a PR event fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create push event file (no pull_request key)
        run: |
          mkdir -p /tmp/gh-events
          cat > /tmp/gh-events/event.json <<'EOF'
          {
            "ref": "refs/heads/main",
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF

      - name: Run action (expect failure - not a PR event)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/gh-events/event.json
        with:
          GITHUB_TOKEN: fake-token-for-testing

      - name: Assert action failed due to non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not a PR event, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not a PR event"

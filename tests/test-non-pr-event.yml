name: Test non-PR event (push event)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create push event file (no pull_request field)
        run: |
          mkdir -p /tmp/test-events
          echo '{"ref":"refs/heads/main","repository":{"full_name":"test-owner/test-repo"}}' > /tmp/test-events/push-event.json

      - name: Run action (expect failure - not a PR event)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: test-owner/test-repo
          GITHUB_EVENT_PATH: /tmp/test-events/push-event.json
        with:
          GITHUB_TOKEN: fake-token

      - name: Assert action failed due to non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when event is not a pull_request, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when event is not a pull_request"

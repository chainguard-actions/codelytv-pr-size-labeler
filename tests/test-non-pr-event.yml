name: Test non-PR event fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Overwrite the act event file with a push event (no pull_request.number).
      # The action should fail because pull_request.number is null in a push event.
      - name: Setup push event file
        run: |
          echo '{"ref":"refs/heads/main","repository":{"full_name":"test-owner/test-repo"}}' > "$GITHUB_EVENT_PATH"

      # The action should fail because pull_request.number is null in a push event.
      # No mock server needed since the action exits before making any API calls.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-token
          github_api_url: http://localhost:18085
          xs_label: size/xs
          xs_max_size: "10"
          s_label: size/s
          s_max_size: "100"
          m_label: size/m
          m_max_size: "500"
          l_label: size/l
          l_max_size: "1000"
          xl_label: size/xl
          fail_if_xl: "false"

      - name: Assert action failed due to non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-PR event, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-PR event"

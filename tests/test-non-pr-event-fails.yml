name: Test non-PR event fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_PATH: ${{ github.workspace }}/pristine/codelytv--pr-size-labeler/v1.10.4/tests/fixtures/push_event.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action on non-PR event (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-token

      - name: Assert action failed on non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-PR event, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on non-PR event"

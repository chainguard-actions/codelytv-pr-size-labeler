name: Test action fails on non-PR event
on:
  workflow_dispatch:

jobs:
  test-non-pr-event:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a push event file (no pull_request key)
        run: |
          cat > /tmp/push-event.json <<'EOF'
          {
            "ref": "refs/heads/main",
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF

      - name: Run action expecting failure (push event, no PR number)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: test-owner/test-repo
          GITHUB_EVENT_PATH: /tmp/push-event.json
        with:
          GITHUB_TOKEN: fake-token

      - name: Assert action failed because event is not a pull request
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-PR event, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-PR event"

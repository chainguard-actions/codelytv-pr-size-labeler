name: Test custom label inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake PR event file
        run: |
          mkdir -p /tmp/fake-event
          cat > /tmp/fake-event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 999999
            }
          }
          EOF

      - name: Run action with custom labels (expect failure - PR does not exist)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/fake-event/event.json
        with:
          GITHUB_TOKEN: ${{ github.token }}
          xs_label: 'custom/xs'
          xs_max_size: '5'
          s_label: 'custom/s'
          s_max_size: '50'
          m_label: 'custom/m'
          m_max_size: '200'
          l_label: 'custom/l'
          l_max_size: '500'
          xl_label: 'custom/xl'
          fail_if_xl: 'false'

      - name: Assert action ran (got past PR number check)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because PR 999999 doesn't exist in the API,
          # but it should NOT fail with "Not a pull request event" — it should
          # get past the event parsing stage. Either failure or success is
          # acceptable here; what matters is the action accepted the custom inputs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted custom label inputs and ran (outcome: $OUTCOME)"

name: Test custom label configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          xs_label: 'T-shirt/XS'
          xs_max_size: '5'
          s_label: 'T-shirt/S'
          s_max_size: '50'
          m_label: 'T-shirt/M'
          m_max_size: '200'
          l_label: 'T-shirt/L'
          l_max_size: '500'
          xl_label: 'T-shirt/XL'
          fail_if_xl: 'false'
          message_if_xl: 'This PR is too large!'

      - name: Assert action failed due to no PR context (not due to bad args)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there's no pull_request event context,
          # not because of invalid arguments. This confirms argument parsing works.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with custom labels (argument parsing succeeded, no PR context)"

name: Test custom label configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts custom label names and size thresholds.
      # Under workflow_dispatch there is no pull_request.number in GITHUB_EVENT_PATH,
      # so the action exits with "Not a pull request event" — expected graceful failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          xs_label: 'custom/xs'
          xs_max_size: '5'
          s_label: 'custom/s'
          s_max_size: '50'
          m_label: 'custom/m'
          m_max_size: '200'
          l_label: 'custom/l'
          l_max_size: '500'
          xl_label: 'custom/xl'

      - name: Assert action failed gracefully on non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (not a pull_request event)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

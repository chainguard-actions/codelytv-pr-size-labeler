name: Test - PR event with invalid token fails at API call
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create pull_request event file
        run: |
          mkdir -p /tmp/gh-events
          cat > /tmp/gh-events/pr-event.json <<'EOF'
          {
            "action": "opened",
            "number": 42,
            "pull_request": {
              "number": 42,
              "title": "Test PR",
              "additions": 5,
              "deletions": 2
            },
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF

      - name: Run action with fake token (expect failure at API call)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/gh-events/pr-event.json
        with:
          GITHUB_TOKEN: fake-token-for-testing
          xs_label: size/xs
          xs_max_size: '10'
          s_label: size/s
          s_max_size: '100'
          m_label: size/m
          m_max_size: '500'
          l_label: size/l
          l_max_size: '1000'
          xl_label: size/xl
          fail_if_xl: 'false'

      - name: Assert action failed (expected - fake token causes API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using a fake token (API call rejected)"

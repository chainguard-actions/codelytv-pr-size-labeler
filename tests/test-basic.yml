name: Test basic PR size labeler usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run PR size labeler (expect failure due to no real PR)
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-token-for-testing
          xs_label: size/xs
          xs_max_size: '10'
          s_label: size/s
          s_max_size: '100'
          m_label: size/m
          m_max_size: '500'
          l_label: size/l
          l_max_size: '1000'
          xl_label: size/xl
          fail_if_xl: 'false'
          files_to_ignore: ''
          ignore_line_deletions: 'false'
          ignore_file_deletions: 'false'
      - name: Assert action ran (pass or fail is acceptable in test env)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail because there is no real GitHub PR in the test environment.
          # We only verify that the action was invoked (outcome is set to success or failure).
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action was invoked with GITHUB_TOKEN input covered"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi

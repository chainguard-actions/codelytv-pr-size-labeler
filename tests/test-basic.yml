name: Test basic usage - default labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action reads GITHUB_EVENT_PATH to get the PR number.
      # Under workflow_dispatch, there is no pull_request.number, so the action
      # exits with "Not a pull request event". This is expected and correct behavior.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action failed gracefully on non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (not a pull_request event)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

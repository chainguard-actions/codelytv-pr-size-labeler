name: Test PR event with default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_PATH: ${{ github.workspace }}/pristine/codelytv--pr-size-labeler/v1.10.4/tests/fixtures/pull_request_event.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with PR event and default inputs (expect API failure with fake token)
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-token
          github_api_url: https://api.github.com

      - name: Assert action attempted to run (failed at API call, not at event parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token and fake repo, the action will fail at the GitHub API call.
          # This is expected behavior — the action correctly parsed the PR event.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to fake credentials, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran and failed at API call stage (expected with fake credentials)"

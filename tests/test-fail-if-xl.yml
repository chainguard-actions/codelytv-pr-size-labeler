name: Test fail_if_xl configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with fail_if_xl=true (expect failure - no PR event)
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          xs_label: 'size/xs'
          xs_max_size: '10'
          s_label: 'size/s'
          s_max_size: '100'
          m_label: 'size/m'
          m_max_size: '500'
          l_label: 'size/l'
          l_max_size: '1000'
          xl_label: 'size/xl'
          fail_if_xl: 'true'
          message_if_xl: 'This PR is too large. Please split it into smaller PRs.'

      - name: Assert action failed due to missing PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there's no PR event.
          # This verifies that fail_if_xl and message_if_xl inputs are accepted correctly.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not triggered by a pull_request event"
            exit 1
          fi
          echo "PASS: action accepted fail_if_xl=true configuration and failed at PR event check (as expected)"

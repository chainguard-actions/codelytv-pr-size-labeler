name: Test missing GITHUB_EVENT_PATH env var
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect failure due to missing GITHUB_EVENT_PATH)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: test-owner/test-repo
          GITHUB_EVENT_PATH: ""
        with:
          GITHUB_TOKEN: fake-token

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_EVENT_PATH is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_EVENT_PATH is missing"

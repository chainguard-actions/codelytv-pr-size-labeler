name: Test ignore options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/10/merge
      GITHUB_HEAD_REF: feature-ignore-test
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_PATH: ${{ github.workspace }}/pristine/codelytv--pr-size-labeler/v1.10.4/tests/fixtures/pull_request_event.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with ignore options enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-token
          github_api_url: https://api.github.com
          files_to_ignore: 'package-lock.json yarn.lock *.generated.ts'
          ignore_line_deletions: 'true'
          ignore_file_deletions: 'true'
          fail_if_xl: 'false'

      - name: Assert action ran with ignore options (fails at API, not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fake credentials, the action will fail at the GitHub API call.
          # This confirms the action accepted files_to_ignore, ignore_line_deletions,
          # and ignore_file_deletions inputs correctly.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to fake credentials, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action accepted ignore options and failed at API call (expected)"

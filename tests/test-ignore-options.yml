name: Test ignore options configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with ignore options (expect failure - no PR event)
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          files_to_ignore: 'package-lock.json yarn.lock *.min.js'
          ignore_line_deletions: 'true'
          ignore_file_deletions: 'false'

      - name: Assert action failed due to missing PR event (not due to bad config)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there's no PR event, not because of bad configuration.
          # This verifies that files_to_ignore, ignore_line_deletions, and ignore_file_deletions
          # inputs are accepted and parsed correctly by docpars.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not triggered by a pull_request event"
            exit 1
          fi
          echo "PASS: action accepted ignore options configuration and failed at PR event check (as expected)"

name: Test action fails without required env vars
on:
  workflow_dispatch:

jobs:
  test-missing-github-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action expecting failure (no GITHUB_REPOSITORY)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ""
          GITHUB_EVENT_PATH: /dev/null
        with:
          GITHUB_TOKEN: fake-token

      - name: Assert action failed due to missing GITHUB_REPOSITORY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_REPOSITORY is not set, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_REPOSITORY is missing"

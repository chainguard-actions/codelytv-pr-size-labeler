name: Test missing GITHUB_REPOSITORY env var
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake event file
        run: |
          mkdir -p /tmp/test-events
          echo '{"pull_request":{"number":42}}' > /tmp/test-events/event.json

      - name: Run action (expect failure due to missing GITHUB_REPOSITORY)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ""
          GITHUB_EVENT_PATH: /tmp/test-events/event.json
        with:
          GITHUB_TOKEN: fake-token

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_REPOSITORY is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_REPOSITORY is missing"

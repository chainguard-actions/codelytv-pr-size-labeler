on:
  pull_request:
  push:
    branches:
      - main

name: Tests

permissions:
  contents: read

jobs:
  tests:
    name: "Run tests"
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: "Install dependencies"
        run: ./install-dependencies.sh

      - name: "Tests"
        run: ./lib/bashunit
